services:
  db:
    image: postgres:16-alpine
    container_name: eve-postgres
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve_healthcare
    ports:
      # Host 5433 avoids clashing with a local PostgreSQL install on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: eve-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: EVE Healthcare
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # DEBUG=true makes Starlette return stack traces instead of the JSON error envelope.
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://eve:eve@db:5432/eve_healthcare
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-string}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-webhook-secret}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
